name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: V3 JavaScript syntax
        run: |
          node --check studio-v3.js
          node --check studio-v3-story.js
          node --check studio-v3-director.js
          node --check studio-v3-eval.js
          node --check studio-v3-storage.js
          node --check studio-v3-groq.js
          node --check studio-v3-themes.js
          node --check studio-v3-render.js
          node --check studio-v3-publish.js
          node --check studio-v3-templates.js
          node --check studio-v3-cloud.js
          node --check cloud/src/worker.js
          node --check tests/ridge-cloud-live-smoke.mjs
          node --check tests/studio-v3-selftest.mjs
          node --check tests/studio-v3-director-selftest.mjs

      - name: V3 architecture regression tests
        run: |
          node --experimental-default-type=module tests/studio-v3-selftest.mjs
          node --experimental-default-type=module tests/studio-v3-director-selftest.mjs

      - name: Required V3 runtime files
        run: |
          test -f studio-v2.html
          test -f studio-v3.css
          test -f studio-v3.js
          test -f studio-v3-story.js
          test -f studio-v3-director.js
          test -f studio-v3-eval.js
          test -f studio-v3-storage.js
          test -f studio-v3-groq.js
          test -f studio-v3-themes.js
          test -f studio-v3-render.js
          test -f studio-v3-publish.js
          test -f studio-v3-templates.js
          test -f studio-v3-cloud.js
          test -f cloud/src/worker.js
          test -f cloud/wrangler.toml
          test -f cloud/package.json

      - name: V3 DOM and runtime budget
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('studio-v2.html','utf8');
          const js=fs.readFileSync('studio-v3.js','utf8');
          const ids=new Set([...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x=>x[1]));
          const refs=new Set([...js.matchAll(/\$\(['"]#([A-Za-z0-9_-]+)['"]\)/g)].map(x=>x[1]));
          const missing=[...refs].filter(x=>!ids.has(x));
          if(missing.length){console.error('Missing V3 DOM ids:',missing);process.exit(1)}
          if(!html.includes('./studio-v3.js')||!html.includes('./studio-v3.css')||!html.includes('./studio-v3-eval.js'))throw new Error('V3 runtime entrypoints missing');
          for(const legacy of ['./studio-v2-lite.js','./studio-v2-combo.js','./studio-v2-credentials.js'])if(html.includes(legacy))throw new Error('Legacy runtime still loaded: '+legacy);
          const moduleScripts=[...html.matchAll(/<script[^>]+type=["']module["'][^>]+src=["']([^"']+)/g)].map(x=>x[1]);
          if(moduleScripts.length!==1||moduleScripts[0].split('?')[0]!=='./studio-v3.js')throw new Error('V3 should keep exactly one local module entrypoint (cache-busting query allowed)');
          console.log(`V3 DOM OK: ${refs.size} references · semantic story + crashproof renderer retained`);
          NODE

      - name: V3 crash-risk and semantic-story guardrails
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('studio-v3.js').read_text()
          story=Path('studio-v3-story.js').read_text()
          director=Path('studio-v3-director.js').read_text()
          render=Path('studio-v3-render.js').read_text()
          storage=Path('studio-v3-storage.js').read_text()
          themes=Path('studio-v3-themes.js').read_text()
          templates=Path('studio-v3-templates.js').read_text()
          cloud=Path('studio-v3-cloud.js').read_text()
          groq=Path('studio-v3-groq.js').read_text()
          evaljs=Path('studio-v3-eval.js').read_text()
          worker=Path('cloud/src/worker.js').read_text()
          if 'decodeAudioData' in render: raise SystemExit('V3 must not full-decode song PCM during final render')
          if 'class SceneLease' not in render or 'bitmap.close' not in render: raise SystemExit('Single-scene lease cleanup missing')
          if 'async _pump()' not in render or 'this.desired' not in render: raise SystemExit('Serialized scene decode lane missing')
          if 'stopPreview(true)' not in render: raise SystemExit('Preview audio graph must stop before CREATE/render')
          if '280*1024*1024' not in render: raise SystemExit('Desktop memory fallback safety limit missing')
          if 'pendingLimit=(mobile?8:24)*MB' not in render: raise SystemExit('Tight mobile OPFS write-backpressure guard missing')
          if 'snapshotVideo' not in render or 'transferToImageBitmap' not in render: raise SystemExit('Video decoder snapshot/release path missing')
          if 'cleanupRidgeStorage' not in render: raise SystemExit('Ridge temp/cache cleanup missing')
          if 'w:640,h:360,fps:20' not in render or 'w:360,h:640,fps:20' not in render: raise SystemExit('Crashproof mobile quality tier missing')
          mime=re.search(r"const stable=safari\?\[[^\]]+\]:\[([^\]]+)\]",render)
          if not mime: raise SystemExit('Browser-specific recorder MIME lists missing')
          chrome=mime.group(1)
          vp8=chrome.find('video/webm;codecs=vp8,opus')
          mp4=chrome.find('video/mp4;codecs=avc1.42E01E,mp4a.40.2')
          if vp8 < 0 or mp4 < 0 or vp8 > mp4: raise SystemExit('Chrome/Android must prefer VP8 WebM before MP4')
          if 'sceneAtTime' not in render or 'chooseForScene' not in render: raise SystemExit('Semantic scene renderer missing')
          if "mode:'read'" not in storage or 'showDirectoryPicker' not in storage: raise SystemExit('Read-only folder flow missing')
          if 'putAsset' in storage: raise SystemExit('Media blobs must not be copied into V3 IndexedDB')
          if 'chooseForScene' not in storage or 'mediaMatchScore' not in storage: raise SystemExit('Meaning-based media selection missing')
          if 'alignLyricsToSegments' not in story or 'buildStoryPlan' not in story: raise SystemExit('Lyric/story timeline engine missing')
          if 'timedLyricCues' not in director or 'buildMeaningTimeline' not in director: raise SystemExit('Merged V3 director regression helper missing')
          if 'story_beats' not in groq or 'visual_bible' not in groq or 'chronological' not in groq: raise SystemExit('Groq semantic continuity contract missing')
          if 'rebuildSemanticTimeline' not in app or 'searchStoryboard' not in app: raise SystemExit('CREATE is not wired to semantic timeline')
          if 'Karaoke progress' not in themes or 'cur.section' not in themes: raise SystemExit('Timed cinematic lyric rendering missing')
          if 'particles.push' in themes or 'stars.push' in themes: raise SystemExit('Unbounded animation state detected')
          if "TEMPLATE_COUNT=VIDEO_TEMPLATES.length" not in templates: raise SystemExit('Template catalog missing')
          if 'Math.min(10' not in cloud: raise SystemExit('Free video retry window must be capped at 10 minutes')
          if '16*1024*1024' not in cloud or 'mobile?1' not in cloud: raise SystemExit('Mobile generated-video memory cap missing')
          if 'FREE_VIDEO_ONLY' not in worker or 'isVerifiedFree' not in worker: raise SystemExit('Cloud AI-video free-only gate missing')
          if 'paid fallback disabled' not in worker: raise SystemExit('Paid fallback refusal missing')
          if '/api/video/generate' in evaljs: raise SystemExit('Diagnostics must never spend HF video credits')
          if 'MIN_RATED=8' not in evaljs or 'NVIDIA_PROMOTE=.75' not in evaljs: raise SystemExit('Model evidence thresholds missing')
          print('V3.9 crashproof decoder snapshot + disk streaming + semantic story guardrails OK.')
          PY

      - name: Reject committed secret-like tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          needles=['g'+'sk'+'_','sk'+'-ant'+'-','sk'+'-proj'+'-']
          files=('studio-v2.html','studio-v3.js','studio-v3-story.js','studio-v3-director.js','studio-v3-eval.js','studio-v3-storage.js','studio-v3-groq.js','studio-v3-themes.js','studio-v3-render.js','studio-v3-publish.js','studio-v3-templates.js','studio-v3-cloud.js','cloud/src/worker.js')
          for name in files:
            text=Path(name).read_text(errors='ignore')
            for n in needles:
              pos=text.find(n)
              if pos>=0 and 'placeholder' not in text[max(0,pos-60):pos+120].lower(): bad.append((name,n))
          if bad: raise SystemExit('Potential committed secret prefix found: '+repr(bad))
          print('No obvious committed secret prefixes found in V3 runtime.')
          PY

      - name: Live Ridge Cloud smoke (non-spending)
        continue-on-error: true
        env:
          RIDGE_CLOUD_URL: https://ridge-cloud-media.founder-f53.workers.dev
        run: node tests/ridge-cloud-live-smoke.mjs
