name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check genres.js
          node --check visuals.js
          node --check lyrics.js
          node --check studio-v2.js
          node --check studio-v2-media.js
          node --check studio-v2-ai.js
          node --check studio-v2-visuals.js
          node --check studio-v2-core.js
          node --check studio-v2-youtube.js
      - name: V2 regression self-tests
        run: |
          node --experimental-default-type=module tests/studio-v2-selftest.mjs
          node --experimental-default-type=module tests/studio-v2-youtube-selftest.mjs
      - name: Required V2 files
        run: |
          test -f studio-v2.html
          test -f studio-v2.css
          test -f studio-v2.js
          test -f studio-v2-core.js
          test -f studio-v2-youtube.js
          test -f studio-v2-media.js
          test -f studio-v2-ai.js
          test -f studio-v2-visuals.js
      - name: V2 DOM references
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const js=fs.readFileSync('studio-v2.js','utf8');
          const html=fs.readFileSync('studio-v2.html','utf8');
          const refs=new Set([...js.matchAll(/\$\(['"]#([A-Za-z0-9_-]+)['"]\)/g)].map(x=>x[1]));
          const ids=new Set([...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x=>x[1]));
          const missing=[...refs].filter(x=>!ids.has(x));
          if(missing.length){console.error('Missing DOM ids:',missing);process.exit(1)}
          console.log(`DOM references OK: ${refs.size}`);
          NODE
      - name: Reject committed secret-like tokens
        shell: bash
        run: |
          if grep -RIE --include='*.js' --include='*.html' --include='*.json' --exclude='lab.html' '(sk-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9_-]{20,}|sk-ant-[A-Za-z0-9_-]{20,})' .; then
            echo 'Potential API secret found in client source.' >&2
            exit 1
          fi
