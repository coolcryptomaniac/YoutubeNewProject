name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check genres.js
          node --check visuals.js
          node --check lyrics.js
          node --check studio-v2.js
          node --check studio-v2-lite.js
          node --check studio-v2-credentials.js
          node --check studio-v2-media.js
          node --check studio-v2-ai.js
          node --check studio-v2-visuals.js
          node --check studio-v2-core.js
          node --check studio-v2-youtube.js
          node --check studio-v2-groq.js
          node --check studio-v2-stock.js
          node --check studio-v2-music.js
          node --check studio-v2-creative.js
          node --check studio-v2-creative-boot.js
          node --check studio-v2-simple.js
          node --check studio-v2-main.js
          node --check studio-v2-prompts.js
          node --check studio-v2-learning.js
          node --check studio-v2-bank.js
          node --check studio-v2-combo.js
      - name: V2 regression self-tests
        run: |
          node --experimental-default-type=module tests/studio-v2-selftest.mjs
          node --experimental-default-type=module tests/studio-v2-youtube-selftest.mjs
          node --experimental-default-type=module tests/studio-v2-plus-selftest.mjs
          node --experimental-default-type=module tests/studio-v2-simple-selftest.mjs
          node --experimental-default-type=module tests/studio-v2-lite-selftest.mjs
          node --experimental-default-type=module tests/studio-v2-credentials-selftest.mjs
          node --experimental-default-type=module tests/studio-v2-v26-selftest.mjs
          node --experimental-default-type=module tests/studio-v2-v27-selftest.mjs
      - name: Required V2 files
        run: |
          test -f studio-v2.html
          test -f studio-v2-lite.css
          test -f studio-v2-lite.js
          test -f studio-v2-credentials.js
          test -f studio-v2-core.js
          test -f studio-v2-youtube.js
          test -f studio-v2-media.js
          test -f studio-v2-ai.js
          test -f studio-v2-visuals.js
          test -f studio-v2-groq.js
          test -f studio-v2-music.js
          test -f studio-v2-creative.js
          test -f studio-v2-prompts.js
          test -f studio-v2-learning.js
          test -f studio-v2-bank.js
          test -f studio-v2-combo.js
      - name: V2.7 DOM references
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('studio-v2.html','utf8');
          const ids=new Set([...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x=>x[1]));
          for(const file of ['studio-v2-lite.js','studio-v2-credentials.js','studio-v2-combo.js']){
            const js=fs.readFileSync(file,'utf8');
            const refs=new Set([...js.matchAll(/\$\(['"]#([A-Za-z0-9_-]+)['"]\)/g)].map(x=>x[1]));
            const missing=[...refs].filter(x=>!ids.has(x));
            if(missing.length){console.error(`Missing DOM ids for ${file}:`,missing);process.exit(1)}
          }
          if(!html.includes('./studio-v2-lite.js'))throw new Error('Lean editor is not the page entrypoint');
          if(!html.includes('./studio-v2-credentials.js'))throw new Error('Persistent credential vault is not loaded');
          if(!html.includes('./studio-v2-combo.js'))throw new Error('Combo/learning layer is not loaded');
          if(/Pexels key/i.test(html))throw new Error('Pexels API key must not appear in the lean UI');
          if(!html.includes('CREATE VIDEO')||!html.includes('Advanced controls'))throw new Error('V2.7 simple shell missing');
          console.log('V2.7 DOM + simple shell + credentials + combo references OK.');
          NODE
      - name: Check V2.7 client files for obvious secret prefixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          bad=[]
          needles=['g'+'sk'+'_','sk'+'-ant'+'-']
          for name in ('studio-v2-lite.js','studio-v2.html','studio-v2-groq.js','studio-v2-credentials.js','studio-v2-combo.js','studio-v2-prompts.js','studio-v2-learning.js','studio-v2-bank.js'):
            text=Path(name).read_text(errors='ignore')
            for n in needles:
              pos=text.find(n)
              if pos>=0 and 'placeholder' not in text[max(0,pos-50):pos+100].lower(): bad.append((name,n))
          if bad:
            raise SystemExit('Potential committed secret prefix found: '+repr(bad))
          print('No obvious committed secret prefixes found in V2.7 files.')
          PY
