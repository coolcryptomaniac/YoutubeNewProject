name: Vusic One-Time Live Proof
# founder-authorized one-release preflight; this revision stops before agreement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vusic-live-proof.yml'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RIDGE_CLOUD_URL: https://ridge-cloud-media.founder-f53.workers.dev
    steps:
      - name: Generate original synthetic WAV and JPG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math, struct, wave
          rate=44100; seconds=62
          chords=[(220.00,277.18,329.63),(196.00,246.94,293.66),(174.61,220.00,261.63),(196.00,246.94,329.63)]
          with wave.open('ridge-canary.wav','wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
              block=bytearray()
              for i in range(rate*seconds):
                  t=i/rate; chord=chords[int(t//4)%len(chords)]
                  env=min(1.0,t/1.5,max(0.0,(seconds-t)/2.0)); pulse=0.72+0.28*math.sin(2*math.pi*2*t)**8
                  sample=sum(math.sin(2*math.pi*f*t) for f in chord)/len(chord); melody=0.28*math.sin(2*math.pi*(440 if int(t*2)%4<2 else 493.88)*t)
                  v=max(-1,min(1,(sample*.42+melody)*env*pulse)); block += struct.pack('<h',int(v*15000))
                  if len(block)>=65536: w.writeframesraw(block); block.clear()
              if block:w.writeframesraw(block)
          PY
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x181226:s=3000x3000:d=1 -frames:v 1 -q:v 2 ridge-canary.jpg
          test -s ridge-canary.wav
          test -s ridge-canary.jpg

      - name: Stage proof media in R2
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ridge-vusic-live-proof")"
          oidc="$(printf '%s' "$token_json" | jq -r '.value')"; test -n "$oidc"; test "$oidc" != "null"; echo "::add-mask::$oidc"
          audio="$(curl --fail-with-body --silent --show-error --max-time 90 -X POST "$RIDGE_CLOUD_URL/api/release/stage" -H "Authorization: Bearer $oidc" -F 'file=@ridge-canary.wav;type=audio/wav')"
          art="$(curl --fail-with-body --silent --show-error --max-time 90 -X POST "$RIDGE_CLOUD_URL/api/release/stage" -H "Authorization: Bearer $oidc" -F 'file=@ridge-canary.jpg;type=image/jpeg')"
          node -e 'for(const s of process.argv.slice(1)){const x=JSON.parse(s);if(!x.ok||x.storage!=="r2")throw new Error("R2 staging failed")}' "$audio" "$art"
          echo "audio_url=$(node -e 'console.log(JSON.parse(process.argv[1]).url)' "$audio")" >> "$GITHUB_OUTPUT"
          echo "art_url=$(node -e 'console.log(JSON.parse(process.argv[1]).url)' "$art")" >> "$GITHUB_OUTPUT"

      - name: Traverse full Vusic wizard to agreement boundary
        shell: bash
        env:
          AUDIO_URL: ${{ steps.stage.outputs.audio_url }}
          ART_URL: ${{ steps.stage.outputs.art_url }}
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ridge-vusic-live-proof")"
          oidc="$(printf '%s' "$token_json" | jq -r '.value')"; test -n "$oidc"; test "$oidc" != "null"; echo "::add-mask::$oidc"
          payload="$(node -e 'console.log(JSON.stringify({title:`Ridge Automation Canary ${new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")}`,artist:"Mohit Pandey",primaryArtist:"Mohit Pandey",composer:"Mohit Pandey",lyricist:"Mohit Pandey",label:"Vusic Records",copyrightOwner:"Vusic Records",releasedPreviously:false,platforms:"all",explicitContent:false,genre:"Electronic",language:"English",lyrics:"Instrumental Ridge automation canary",releaseDate:"2026-09-10",audioUrl:process.env.AUDIO_URL,audioName:"ridge-canary.wav",audioType:"audio/wav",artworkUrl:process.env.ART_URL,artworkName:"ridge-canary.jpg",artworkType:"image/jpeg",canaryMode:"pre-agreement",confirmSubmit:false}))')"
          status="$(curl --silent --show-error --max-time 360 -o vusic-preflight.json -w '%{http_code}' -X POST "$RIDGE_CLOUD_URL/api/release/vusic" -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' --data "$payload")"
          echo "VUSIC_PREFLIGHT_HTTP_STATUS=$status"
          echo 'VUSIC_PREFLIGHT_RESPONSE_BEGIN'; cat vusic-preflight.json; echo; echo 'VUSIC_PREFLIGHT_RESPONSE_END'
          node -e 'const fs=require("fs");const status=Number(process.argv[1]);const x=JSON.parse(fs.readFileSync("vusic-preflight.json","utf8"));if(status!==200||x.ok!==true||x.canary!==true||x.stage!=="pre-agreement")throw new Error("Vusic full preflight failed: HTTP "+status+" "+JSON.stringify(x));console.log("VUSIC_PREFLIGHT_REACHED_AGREEMENT",JSON.stringify({title:x.title,pageUrl:x.pageUrl,steps:x.steps}))' "$status"
