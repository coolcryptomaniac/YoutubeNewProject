name: Vusic One-Time Live Proof
# Founder-authorized exactly-once synthetic release. R2 lock prevents duplicate final submissions.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: vusic-one-time-live-proof
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RIDGE_CLOUD_URL: https://ridge-cloud-media.founder-f53.workers.dev
    steps:
      - name: Check exactly-once R2 lock
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ridge-vusic-live-proof")"
          oidc="$(printf '%s' "$token_json" | jq -r '.value')"; test -n "$oidc"; test "$oidc" != "null"; echo "::add-mask::$oidc"
          status_file="$(mktemp)"
          http="$(curl --silent --show-error --max-time 30 -o "$status_file" -w '%{http_code}' "$RIDGE_CLOUD_URL/api/vusic-one-release/status" -H "Authorization: Bearer $oidc")"
          cat "$status_file" | jq '{locked,state:{status:.state.status,title:.state.title,finishedAt:.state.finishedAt},error}' || cat "$status_file"
          if [ "$http" != "200" ]; then echo "::error::One-release status check failed with HTTP $http"; exit 1; fi
          status="$(cat "$status_file")"
          locked="$(printf '%s' "$status" | jq -r '.locked')"
          if [ "$locked" = "true" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Preflight proof authentication and R2/Vusic capabilities
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ridge-vusic-live-proof")"
          oidc="$(printf '%s' "$token_json" | jq -r '.value')"; test -n "$oidc"; test "$oidc" != "null"; echo "::add-mask::$oidc"
          body="$(mktemp)"
          http="$(curl --silent --show-error --max-time 30 -o "$body" -w '%{http_code}' "$RIDGE_CLOUD_URL/api/release/capabilities" -H "Authorization: Bearer $oidc")"
          cat "$body" | jq '{ok,stagingMode,vusic,error}' || cat "$body"
          if [ "$http" != "200" ]; then echo "::error::Proof OIDC bridge rejected capabilities preflight with HTTP $http"; exit 1; fi
          node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!x.ok||x.stagingMode!=="r2"||!x.vusic?.configured||!x.vusic?.browserBound||!x.vusic?.mediaStaging) throw new Error("Vusic/R2 preflight is not production-ready")' "$body"

      - name: Generate original synthetic WAV and 3000x3000 artwork
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math, struct, wave, zlib, binascii
          rate=44100; seconds=62
          chords=[(220.00,277.18,329.63),(196.00,246.94,293.66),(174.61,220.00,261.63),(196.00,246.94,329.63)]
          with wave.open('ridge-canary.wav','wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
              block=bytearray()
              for i in range(rate*seconds):
                  t=i/rate; chord=chords[int(t//4)%len(chords)]
                  env=min(1.0,t/1.5,max(0.0,(seconds-t)/2.0)); pulse=0.72+0.28*math.sin(2*math.pi*2*t)**8
                  sample=sum(math.sin(2*math.pi*f*t) for f in chord)/len(chord); melody=0.28*math.sin(2*math.pi*(440 if int(t*2)%4<2 else 493.88)*t)
                  v=max(-1,min(1,(sample*.42+melody)*env*pulse)); block += struct.pack('<h',int(v*15000))
                  if len(block)>=65536: w.writeframesraw(block); block.clear()
              if block:w.writeframesraw(block)
          width=height=3000
          def chunk(kind,data): return struct.pack('>I',len(data))+kind+data+struct.pack('>I',binascii.crc32(kind+data)&0xffffffff)
          row=b'\x00'+bytes((24,18,38))*width; raw=row*height
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',width,height,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          open('ridge-canary.png','wb').write(png)
          PY
          test -s ridge-canary.wav
          test -s ridge-canary.png

      - name: Stage proof media in R2
        if: steps.guard.outputs.skip != 'true'
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ridge-vusic-live-proof")"
          oidc="$(printf '%s' "$token_json" | jq -r '.value')"; test -n "$oidc"; test "$oidc" != "null"; echo "::add-mask::$oidc"
          stage_one(){
            local path="$1" type="$2" out http
            out="$(mktemp)"
            http="$(curl --silent --show-error --max-time 90 -o "$out" -w '%{http_code}' -X POST "$RIDGE_CLOUD_URL/api/release/stage" -H "Authorization: Bearer $oidc" -F "file=@$path;type=$type")"
            if [ "$http" != "200" ] && [ "$http" != "201" ]; then
              echo "::error::R2 staging failed for $path with HTTP $http"
              cat "$out"
              return 1
            fi
            node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(!x.ok||x.storage!=="r2"||!x.url)throw new Error("R2 staging response invalid")' "$out"
            cat "$out"
          }
          audio="$(stage_one ridge-canary.wav audio/wav)"
          art="$(stage_one ridge-canary.png image/png)"
          echo "audio_url=$(node -e 'console.log(JSON.parse(process.argv[1]).url)' "$audio")" >> "$GITHUB_OUTPUT"
          echo "art_url=$(node -e 'console.log(JSON.parse(process.argv[1]).url)' "$art")" >> "$GITHUB_OUTPUT"

      - name: Submit the one founder-authorized Vusic release
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          AUDIO_URL: ${{ steps.stage.outputs.audio_url }}
          ART_URL: ${{ steps.stage.outputs.art_url }}
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ridge-vusic-live-proof")"
          oidc="$(printf '%s' "$token_json" | jq -r '.value')"; test -n "$oidc"; test "$oidc" != "null"; echo "::add-mask::$oidc"
          payload="$(node -e 'console.log(JSON.stringify({title:"Ridge Automation Canary One-Time",artist:"Mohit Pandey",primaryArtist:"Mohit Pandey",composer:"Mohit Pandey",lyricist:"Mohit Pandey",label:"Vusic Records",copyrightOwner:"Vusic Records",signatory:"Mohit Pandey",releasedPreviously:false,platforms:"all",explicitContent:false,genre:"Electronic",language:"English",lyrics:"Instrumental Ridge automation canary",releaseDate:"2026-09-12",audioUrl:process.env.AUDIO_URL,audioName:"ridge-canary.wav",audioType:"audio/wav",artworkUrl:process.env.ART_URL,artworkName:"ridge-canary.png",artworkType:"image/png",confirmSubmit:true}))')"
          http="$(curl --silent --show-error --max-time 420 -o vusic-result.json -w '%{http_code}' -X POST "$RIDGE_CLOUD_URL/api/vusic-one-release/execute" -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' --data "$payload")"
          echo "VUSIC_ONE_RELEASE_HTTP_STATUS=$http"
          jq '{ok,locked,state:{status:.state.status,title:.state.title,finishedAt:.state.finishedAt,reason:.state.reason},result:{submitted:.result.submitted,message:.result.message,pageUrl:.result.pageUrl},error}' vusic-result.json
          state="$(jq -r '.state.status // empty' vusic-result.json)"
          if [ "$state" = "submitted" ]; then echo "VUSIC_ONE_RELEASE_SUCCESS=1"; exit 0; fi
          if [ "$state" = "ambiguous" ]; then echo "::error::Final submission may have occurred; exactly-once lock engaged. Manual Vusic verification required before any reset."; exit 1; fi
          if [ "$http" = "401" ]; then echo "::error::Proof OIDC authentication failed at final execute; deployment/auth contract is inconsistent."; exit 1; fi
          echo "::error::Vusic release not submitted yet; state=$state, HTTP=$http. Automatic retry remains safe only when state is retryable and the final-submit boundary was not crossed."
          exit 1

      - name: Already completed or locked
        if: steps.guard.outputs.skip == 'true'
        run: echo "Exactly-once Vusic release is already locked; no browser opened and no duplicate submission attempted."
