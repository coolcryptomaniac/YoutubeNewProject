name: Vusic One-Time Live Proof
# account-and-entitlement-diagnostic-only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vusic-live-proof.yml'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RIDGE_CLOUD_URL: https://ridge-cloud-media.founder-f53.workers.dev
    steps:
      - name: Verify exact Vusic account and entitlement state
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ridge-vusic-live-proof")"
          oidc="$(printf '%s' "$token_json" | jq -r '.value')"
          test -n "$oidc"; test "$oidc" != "null"; echo "::add-mask::$oidc"
          status="$(curl --silent --show-error --max-time 180 \
            -o vusic-account.json -w '%{http_code}' \
            -X POST "$RIDGE_CLOUD_URL/api/release/vusic-account-smoke" \
            -H "Authorization: Bearer $oidc" \
            -H 'Content-Type: application/json' \
            --data '{"expectedArtist":"Mohit Pandey"}')"
          echo "VUSIC_ACCOUNT_HTTP_STATUS=$status"
          echo 'VUSIC_ACCOUNT_RESPONSE_BEGIN'
          cat vusic-account.json
          echo
          echo 'VUSIC_ACCOUNT_RESPONSE_END'
          node -e 'const fs=require("fs");const status=Number(process.argv[1]);const x=JSON.parse(fs.readFileSync("vusic-account.json","utf8"));if(status!==200||x.ok!==true)throw new Error("Vusic account diagnostic failed: HTTP "+status+" "+JSON.stringify(x));if(x.expectedArtistMatch!==true)throw new Error("Vusic automation is not in expected artist account");console.log("VUSIC_ACCOUNT_DIAGNOSTIC_PASS",JSON.stringify(x))' "$status"
