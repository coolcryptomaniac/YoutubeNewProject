name: Patch Vusic Asset Stage Guard

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-vusic-asset-stage.py'
      - '.github/workflows/patch-vusic-asset-stage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and validate Vusic stage guard
        run: |
          set -euo pipefail
          python3 scripts/patch-vusic-asset-stage.py
          node --check cloud/src/providers/vusic.js
          node tests/vusic-browser-contract-selftest.mjs
          grep -q 'requireDateStage' cloud/src/providers/vusic.js
          grep -q "stage:'assets-to-go-live-date'" cloud/src/providers/vusic.js
      - name: Commit source patch
        run: |
          set -euo pipefail
          if git diff --quiet -- cloud/src/providers/vusic.js; then
            echo 'Vusic asset-stage guard already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud/src/providers/vusic.js
          git commit -m 'Require real Vusic date stage after asset upload'
          git push origin HEAD:main
