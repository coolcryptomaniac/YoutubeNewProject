name: Deploy Ridge Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - '.github/workflows/deploy-ridge-cloud.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RIDGE_GITHUB_TOKEN: ${{ secrets.RIDGE_GITHUB_TOKEN }}
          VUSIC_USERNAME: ${{ secrets.VUSIC_USERNAME }}
          VUSIC_PASSWORD: ${{ secrets.VUSIC_PASSWORD }}
          RIDGE_ADMIN_TOKEN: ${{ secrets.RIDGE_ADMIN_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PEXELS_API_KEY"
          printf '%s' "$PEXELS_API_KEY" | npx wrangler secret put PEXELS_API_KEY
          if [ -n "$HF_TOKEN" ]; then printf '%s' "$HF_TOKEN" | npx wrangler secret put HF_TOKEN; fi
          if [ -n "$NVIDIA_API_KEY" ]; then printf '%s' "$NVIDIA_API_KEY" | npx wrangler secret put NVIDIA_API_KEY; fi
          if [ -n "$GROQ_API_KEY" ]; then printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY; fi
          if [ -n "$RIDGE_GITHUB_TOKEN" ]; then printf '%s' "$RIDGE_GITHUB_TOKEN" | npx wrangler secret put RIDGE_GITHUB_TOKEN; fi
          if [ -n "$VUSIC_USERNAME" ]; then printf '%s' "$VUSIC_USERNAME" | npx wrangler secret put VUSIC_USERNAME; fi
          if [ -n "$VUSIC_PASSWORD" ]; then printf '%s' "$VUSIC_PASSWORD" | npx wrangler secret put VUSIC_PASSWORD; fi
          if [ -n "$RIDGE_ADMIN_TOKEN" ]; then printf '%s' "$RIDGE_ADMIN_TOKEN" | npx wrangler secret put RIDGE_ADMIN_TOKEN; fi
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Post-deploy live smoke
        env:
          RIDGE_CLOUD_URL: https://ridge-cloud-media.founder-f53.workers.dev
        run: node ../tests/ridge-cloud-live-smoke.mjs
