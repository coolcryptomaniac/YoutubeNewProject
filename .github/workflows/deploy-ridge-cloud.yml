name: Deploy Ridge Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - 'tests/ridge-cloud-live-smoke.mjs'
      - 'tests/vusic-browser-contract-selftest.mjs'
      - '.github/workflows/deploy-ridge-cloud.yml'
      - '.github/workflows/ridge-render-queue.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud dependencies with watchdog
        timeout-minutes: 4
        env:
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_fetch_retries: "2"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "5000"
          npm_config_fetch_timeout: "30000"
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Validate deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Validate v14 free-first, R2 library, YouTube and Vusic browser contracts
        run: |
          set -euo pipefail
          grep -E 'TEXT_PROVIDER_ORDER|CF_TEXT_MODELS|NVIDIA_TEXT_MODELS|ALLOW_GROQ_TEXT_FALLBACK|YOUTUBE_DAILY_UPLOAD_CAP|YOUTUBE_DEFAULT_PRIVACY' wrangler.toml
          ! grep -q 'meta/llama-3.3-70b-instruct' wrangler.toml
          grep -q 'ALLOW_GROQ_TEXT_FALLBACK = "false"' wrangler.toml
          grep -q 'YOUTUBE_DAILY_UPLOAD_CAP = "10"' wrangler.toml
          grep -q 'YOUTUBE_DEFAULT_PRIVACY = "private"' wrangler.toml
          grep -q 'main = "src/worker-v14.js"' wrangler.toml
          node --check src/providers/text-refine.js
          node --check src/providers/github-oidc.js
          node --check src/providers/song-library.js
          node --check src/providers/youtube-server.js
          node --check src/providers/vusic.js
          node --check src/worker-v11.js
          node --check src/worker-v12.js
          node --check src/worker-v13.js
          node --check src/worker-v14.js
          node ../tests/vusic-browser-contract-selftest.mjs
          grep -q "reviewBoundaryObjectAware:true" src/worker-v13.js
          grep -q "vusic-one-release/diagnostic" src/worker-v14.js
      - name: Ensure global release staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler r2 bucket info ridge-release-media >/dev/null 2>&1
          found=$?
          if [ "$found" -ne 0 ]; then
            npx wrangler r2 bucket create ridge-release-media --location apac
            found=$?
          fi
          if [ "$found" -ne 0 ]; then echo "::error::R2 is not ready"; exit 1; fi
          set -e
      - name: Enable global release binding
        run: |
          cat >> wrangler.toml <<'EOF'

          [[r2_buckets]]
          binding = "RELEASE_MEDIA"
          bucket_name = "ridge-release-media"
          EOF
      - name: Deploy without rewriting secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Post-deploy live smoke
        env:
          RIDGE_CLOUD_URL: https://ridge-cloud-media.founder-f53.workers.dev
        run: node ../tests/ridge-cloud-live-smoke.mjs
      - name: Verify deployed worker generation
        env:
          RIDGE_CLOUD_URL: https://ridge-cloud-media.founder-f53.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail-with-body --silent --show-error --max-time 30 "$RIDGE_CLOUD_URL/api/resilience/health")"
          echo "$health" | jq '{ok,worker,vusicProofAuth,vusicExactlyOnce,vusicDiagnostic}'
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok||x.worker!=="v14"||!x.vusicProofAuth?.stageBridge||!x.vusicExactlyOnce?.reviewBoundaryObjectAware||!x.vusicDiagnostic?.protected||!x.vusicDiagnostic?.sanitized) throw new Error("Worker v14 safeguards not live")' "$health"
      - name: Vusic configuration and protected diagnostic smoke
        env:
          RIDGE_CLOUD_URL: https://ridge-cloud-media.founder-f53.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=ridge-deploy-smoke")"
          oidc="$(printf '%s' "$token_json" | jq -r '.value')"; test -n "$oidc"; test "$oidc" != "null"; echo "::add-mask::$oidc"
          status="$(curl --fail-with-body --silent --show-error --max-time 30 "$RIDGE_CLOUD_URL/api/release/vusic-status")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok||!x.browserBound||!x.usernamePresent||!x.passwordPresent) throw new Error("Vusic configuration incomplete")' "$status"
          caps="$(curl --fail-with-body --silent --show-error --max-time 30 "$RIDGE_CLOUD_URL/api/release/capabilities" -H "Authorization: Bearer $oidc")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok||x.stagingMode!=="r2"||!x.vusic?.configured||!x.vusic?.browserBound||!x.vusic?.mediaStaging) throw new Error("Vusic capabilities not production-ready")' "$caps"
          diag="$(curl --fail-with-body --silent --show-error --max-time 30 "$RIDGE_CLOUD_URL/api/vusic-one-release/diagnostic" -H "Authorization: Bearer $oidc")"
          echo "$diag" | jq '{status,reason,steps,control,alerts,before,after}'
