name: Deploy Ridge Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - 'tests/ridge-cloud-live-smoke.mjs'
      - '.github/workflows/deploy-ridge-cloud.yml'
      - '.github/workflows/ridge-render-queue.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud dependencies with watchdog
        timeout-minutes: 4
        env:
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_fetch_retries: "2"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "5000"
          npm_config_fetch_timeout: "30000"
        run: npm install --no-audit --no-fund --prefer-offline
      - name: Validate deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RIDGE_ADMIN_TOKEN: ${{ secrets.RIDGE_ADMIN_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$RIDGE_ADMIN_TOKEN"
      - name: Validate adaptive free-first text and render queue configuration
        run: |
          set -euo pipefail
          grep -E 'TEXT_PROVIDER_ORDER|CF_TEXT_MODELS|NVIDIA_TEXT_MODELS|ALLOW_GROQ_TEXT_FALLBACK' wrangler.toml
          ! grep -q 'meta/llama-3.3-70b-instruct' wrangler.toml
          grep -q 'ALLOW_GROQ_TEXT_FALLBACK = "false"' wrangler.toml
          grep -q 'main = "src/worker-v9.js"' wrangler.toml
          node --check src/providers/text-refine.js
          node --check src/worker-v8.js
          node --check src/worker-v9.js
      - name: Ensure global release staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler r2 bucket info ridge-release-media >/dev/null 2>&1
          found=$?
          if [ "$found" -ne 0 ]; then
            echo "R2 is enabled but ridge-release-media is not visible yet; creating the bucket..."
            npx wrangler r2 bucket create ridge-release-media --location apac
            create_status=$?
            if [ "$create_status" -eq 0 ]; then
              sleep 2
              npx wrangler r2 bucket info ridge-release-media >/dev/null 2>&1
              found=$?
            else
              found=$create_status
            fi
          fi
          if [ "$found" -eq 0 ]; then
            echo "RIDGE_R2_READY=1" >> "$GITHUB_ENV"
            echo "Global R2 release staging bucket is ready."
          else
            echo "RIDGE_R2_READY=0" >> "$GITHUB_ENV"
            echo "::error::R2 is not ready. Ridge refuses edge-local staging because it is not crash-resistant."
            exit 1
          fi
          set -e
      - name: Enable global release binding
        run: |
          cat >> wrangler.toml <<'EOF'

          [[r2_buckets]]
          binding = "RELEASE_MEDIA"
          bucket_name = "ridge-release-media"
          EOF
      - name: Deploy without rewriting secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Post-deploy live smoke
        env:
          RIDGE_CLOUD_URL: https://ridge-cloud-media.founder-f53.workers.dev
        run: node ../tests/ridge-cloud-live-smoke.mjs
      - name: Vusic automation smoke
        env:
          RIDGE_CLOUD_URL: https://ridge-cloud-media.founder-f53.workers.dev
          RIDGE_ADMIN_TOKEN: ${{ secrets.RIDGE_ADMIN_TOKEN }}
          VUSIC_USERNAME: ${{ secrets.VUSIC_USERNAME }}
          VUSIC_PASSWORD: ${{ secrets.VUSIC_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.RIDGE_CLOUD_URL.replace(/\/$/,'');
          const status=await fetch(base+'/api/release/vusic-status').then(async r=>({status:r.status,body:await r.json()}));
          assert.equal(status.status,200,'Vusic status endpoint');
          assert.equal(status.body.browserBound,true,'Browser Run binding missing');
          if(process.env.VUSIC_USERNAME)assert.equal(status.body.usernamePresent,true,'Vusic username secret missing from deployed Worker');
          if(process.env.VUSIC_PASSWORD)assert.equal(status.body.passwordPresent,true,'Vusic password secret missing from deployed Worker');
          const caps=await fetch(base+'/api/release/capabilities',{headers:{Authorization:'Bearer '+process.env.RIDGE_ADMIN_TOKEN}});
          assert.equal(caps.status,200,'Release capabilities authorization failed');
          const c=await caps.json();
          assert.equal(c.stagingMode,'r2','R2 binding did not reach deployed Worker');
          console.log('Vusic capabilities:',JSON.stringify({configured:c.vusic?.configured,browserBound:c.vusic?.browserBound,mediaStaging:c.vusic?.mediaStaging,stagingMode:c.stagingMode}));
          if(process.env.VUSIC_USERNAME&&process.env.VUSIC_PASSWORD){
            const r=await fetch(base+'/api/release/vusic-login-smoke',{method:'POST',headers:{Authorization:'Bearer '+process.env.RIDGE_ADMIN_TOKEN}});
            const body=await r.json().catch(()=>({}));
            if(r.status!==200||body.ok!==true)throw new Error('Vusic login smoke failed: '+r.status+' '+JSON.stringify(body));
            console.log('Vusic login smoke: PASS',JSON.stringify({authenticated:body.authenticated,releaseAccessible:body.releaseAccessible,browserBinding:body.browserBinding}));
          } else {
            console.log('Vusic login smoke skipped because GitHub VUSIC_USERNAME/VUSIC_PASSWORD secrets are not both present.');
          }
          NODE
