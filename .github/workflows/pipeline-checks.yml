name: Cloud pipeline checks

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'pipeline.html'
      - 'pipeline.js'
      - 'cloud/src/worker-v4.js'
      - 'cloud/src/worker-v5.js'
      - 'cloud/src/worker-v6.js'
      - 'cloud/src/worker-v7.js'
      - 'cloud/src/worker-v8.js'
      - 'cloud/src/worker-v9.js'
      - '.github/workflows/ridge-cloud-render.yml'
      - '.github/workflows/ridge-render-queue.yml'
      - 'cloud/wrangler.toml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check pipeline.js
          node --check cloud/src/worker-v4.js
          node --check cloud/src/worker-v5.js
          node --check cloud/src/worker-v6.js
          node --check cloud/src/worker-v7.js
          node --check cloud/src/worker-v8.js
          node --check cloud/src/worker-v9.js
      - name: Cloud-first contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('pipeline.html').read_text()
          js=Path('pipeline.js').read_text()
          w4=Path('cloud/src/worker-v4.js').read_text()
          w5=Path('cloud/src/worker-v5.js').read_text()
          w6=Path('cloud/src/worker-v6.js').read_text()
          w7=Path('cloud/src/worker-v7.js').read_text()
          w8=Path('cloud/src/worker-v8.js').read_text()
          w9=Path('cloud/src/worker-v9.js').read_text()
          wr=Path('cloud/wrangler.toml').read_text()
          wf=Path('.github/workflows/ridge-cloud-render.yml').read_text()
          qf=Path('.github/workflows/ridge-render-queue.yml').read_text()
          for text in ['Lyrics video','Music visualizer','Photo music video','Pexels cinematic stock edit']:
              assert text in html,text
          assert 'RIDGE_ADMIN_TOKEN' not in html
          assert 'MediaRecorder' not in js and 'captureStream' not in js
          assert 'GROQ_API_KEY' in w4 and 'RIDGE_GITHUB_TOKEN' in w4
          assert "paidFallback:false" in w4
          assert 'sessionValid' in w5
          assert 'phoneEncoding:false' in w6 and '/api/mobile/render' in w6 and 'RELEASE_MEDIA' in w6
          assert 'pipeline-stage/' in w7 and 'pipeline-render/' in w7 and 'caches.default' not in w7
          assert 'render-failure' in w8 and 'staleJobRecovery:true' in w8
          assert 'render-queue/' in w9 and 'render-lease/' in w9 and 'r2-github-scheduler' in w9
          assert '/api/render/claim' in w9 and '/api/render/ack/' in w9
          assert 'main = "src/worker-v9.js"' in wr
          assert 'ffmpeg' in wf and 'showwaves' in wf and 'subtitles=lyrics.srt' in wf
          assert 'Report render failure to Ridge Cloud' in wf and 'retry-all-errors' in wf
          assert "cron: '*/5 * * * *'" in qf and 'actions: write' in qf and 'gh workflow run ridge-cloud-render.yml' in qf
          assert 'RIDGE_GITHUB_TOKEN' not in qf
          assert 'Pexels' in html and '/api/pexels/search' in wf
          print('Ridge durable cloud pipeline + v9 R2 render scheduler contracts OK')
          PY
