name = "ridge-cloud-media"
main = "src/worker-v9.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[ai]
binding = "AI"

[triggers]
crons = ["17 * * * *"]

[vars]
HF_VIDEO_MODEL = "Lightricks/LTX-Video-0.9.8-13B-distilled"
FREE_VIDEO_ONLY = "true"
RIDGE_PAID_FALLBACK = "false"

# Text refinement is optional and free-first. Ridge tries candidates in order,
# skips retired/out-of-capacity models, and finally keeps the canonical package.
TEXT_PROVIDER_ORDER = "workers-ai,nvidia,groq,bypass"
CF_TEXT_MODELS = "@cf/zai-org/glm-4.7-flash,@cf/nvidia/nemotron-3-120b-a12b,@cf/google/gemma-4-26b-a4b-it"
DIRECTOR_TEXT_MODEL = "@cf/zai-org/glm-4.7-flash"
NVIDIA_TEXT_MODELS = "nvidia/nemotron-3.5-lightning-30b-a3b,openai/gpt-oss-20b,openai/gpt-oss-120b,deepseek-ai/deepseek-v4-flash-0731"
# Groq production models have published usage pricing, so keep automatic Groq
# fallback disabled unless the founder explicitly opts in later.
ALLOW_GROQ_TEXT_FALLBACK = "false"
GROQ_TEXT_MODELS = "openai/gpt-oss-20b,llama-3.1-8b-instant"
GROQ_TEXT_MODEL = "openai/gpt-oss-20b"
GROQ_TRANSCRIBE_MODEL = "whisper-large-v3-turbo"

META_GRAPH_VERSION = "v25.0"
LINKEDIN_VERSION = "202607"
